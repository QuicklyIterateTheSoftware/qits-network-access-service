# qits-network-access domain defaults, shipped from this library jar at ordinal 100. The deployable's
# application.properties (250) and the environment (300) override any of them.
#
# THE PLATFORM'S GENERIC RESOURCE CONTRACT. .config/qits/deployments.yml declares
# `postgresql:db:qits_network_access`; qits-deployments creates the role and the database before the
# container starts and injects QITS_RESOURCE_DB_URL / _USERNAME / _PASSWORD. No defaults, on purpose:
# an unset variable fails the boot at Flyway naming what is missing, rather than opening some store
# nobody meant. The suite supplies the values (service/src/test/.../testdb/EmbeddedPgConfigSource).
quarkus.datasource.networkaccess.db-kind=postgresql
quarkus.datasource.networkaccess.jdbc.url=${QITS_RESOURCE_DB_URL}
quarkus.datasource.networkaccess.username=${QITS_RESOURCE_DB_USERNAME}
quarkus.datasource.networkaccess.password=${QITS_RESOURCE_DB_PASSWORD}

# THE POOL SURVIVES A POSTGRES CUTOVER. All three lines or none: DatasourceBaselineTest fails the
# build if one goes missing.
quarkus.datasource.networkaccess.jdbc.driver=eu.wohlben.qits.db.PatientPgDriver
quarkus.datasource.networkaccess.jdbc.acquisition-timeout=15S
quarkus.datasource.networkaccess.jdbc.validate-on-borrow=true

# A dedicated persistence unit bound to this datasource, owning only this module's entities.
quarkus.hibernate-orm.networkaccess.datasource=networkaccess
quarkus.hibernate-orm.networkaccess.packages=eu.wohlben.qits.networkaccess.entity

# Own Flyway lineage, hand-written and appended to. No baseline-on-migrate: every database this
# lineage meets is empty or was created by it.
quarkus.flyway.networkaccess.migrate-at-start=true
quarkus.flyway.networkaccess.locations=classpath:db/networkaccess/migration

# --- the tunnel (values of qits-1976, unchanged) --------------------------------------------------
# The tunnel network, and the first host number a peer may be given. .1 is the private edge (and
# the tunnel DNS server), .2 to .9 are reserved (.2 was the qits-1976 proof peer), so peers are
# allocated .10 upwards to the last host below the broadcast address: 100.96.0.10 to 100.96.0.254,
# the lowest one no ACTIVE peer holds.
qits.network-access.tunnel.cidr=100.96.0.0/24
qits.network-access.tunnel.first-host=10
