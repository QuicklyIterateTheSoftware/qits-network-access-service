# The application config for qits-network-access as a standalone process (ordinal 250). The library
# jars ship their defaults at ordinal 100 in META-INF/microprofile-config.properties: `domain` its
# datasource, persistence unit, Flyway lineage and tunnel values; qits-eventstream its bus url,
# outbox datasource and retry budget. A deployment still overrides any of it by env.

quarkus.application.name=qits-network-access

# Every route lives under /network-access: the API at /network-access/api, and Quarkus' own
# non-application root (health, the API document) at /network-access/q, where the deploy gates on
# /network-access/q/health/ready (.config/qits/deployments.yml).
quarkus.rest.path=/network-access/api
quarkus.http.non-application-root-path=/network-access/q

# --- machine identity -----------------------------------------------------------------------------
# EVERY DOOR TAKES A BEARER: there is no anonymous door here, reads included, because a peer list
# says who can reach the private edge. Each resource names its roles with @RolesAllowed (the design
# page's two sets; see api/Roles).
#
# THE ROLLOUT GATE SHIPS ON (qits.auth.machine.required, defaulted false by qits-auth-core — this
# literal overrides that library default at ordinal 250). On, quarkus-oidc validates every bearer
# against qits-idp; off, there is no OIDC tenant at all. %dev./%test. put it off, which is what lets
# a clone-alone `./mvnw verify` need no issuer: the suites state their callers with @TestSecurity.
# There is no third state — either the gate and the validation are both on, or both off.
qits.auth.machine.required=true
quarkus.oidc.tenant-enabled=${qits.auth.machine.required:false}
%dev.qits.auth.machine.required=false
%test.qits.auth.machine.required=false

# Bearer-only: this service starts no login flow and holds no session.
#
# THE IDP IS DIALLED AT ITS EDGE HOST: https://idp.qits.<domain>/idp, never a wire alias.
# QITS_DOMAIN is injected into every container by qits-deployments and carries NO default here: a
# deployment without it refuses to start rather than validating against a half name.
quarkus.oidc.auth-server-url=https://idp.qits.${QITS_DOMAIN}/idp
quarkus.oidc.application-type=service

# Discovery ON (the default): the tenant reads /idp/.well-known/openid-configuration and takes the
# JWKS address from its jwks_uri. The pact pacts/qits-network-access-service_qits-idp-service.json
# binds both reads.

# ONE audience on this platform, carried by every token — a service's, a person's `qits` CLI token,
# a node's registration token alike — so it is a literal: what a caller may do is decided by its
# roles, never by which service it was addressed to.
quarkus.oidc.token.audience=qits-platform

# AN UNREACHABLE IDP DOES NOT STOP THIS SERVICE: the boot-time JWKS fetch fails to a WARN and is
# retried for connection-delay, and readiness stays independent of idp. This matters here more than
# most: the place that grants access must survive a fault of the things it grants access to.
quarkus.oidc.connection-delay=30S

# A ROTATED idp key reaches this service in seconds rather than the default ten minutes.
quarkus.oidc.token.forced-jwk-refresh-interval=PT5S

# --- the token this service PRESENTS ---------------------------------------------------------------
# ONE named client, `qits`: this process's own qits-idp service client by client credentials, the
# `idp:client` resource .config/qits/deployments.yml declares (id `<env>-qits-network-access`). The
# qits-eventstream library and qits-telemetry-core ask OidcClients for it by name; the qits-system
# registration check of the node join (section 5 of the design) will be its first caller in this
# source tree. Reference the raw env names inside `${…}`: QITS_RESOURCE_* has no dotted twin.
quarkus.oidc-client.qits.auth-server-url=${QITS_RESOURCE_IDP_URL:https://idp.qits.${QITS_DOMAIN}/idp}
quarkus.oidc-client.qits.discovery-enabled=false
quarkus.oidc-client.qits.token-path=token
quarkus.oidc-client.qits.client-id=${QITS_RESOURCE_IDP_CLIENT_ID:dev-qits-network-access}
quarkus.oidc-client.qits.credentials.secret=${QITS_RESOURCE_IDP_CLIENT_SECRET:}
quarkus.oidc-client.qits.grant.type=client
quarkus.oidc-client.qits.grant-options.client.audience=qits-platform
quarkus.oidc-client.qits.early-tokens-acquisition=false
quarkus.oidc-client.qits.client-enabled=true
%dev.quarkus.oidc-client.qits.client-enabled=false
%test.quarkus.oidc-client.qits.client-enabled=false

# --- what GET /companion answers -------------------------------------------------------------------
# The companion image is built from this repository beside qits/qits-network-access and released
# with the same version, so the CLI pulls exactly `<image>:<this service's version>`.
# quarkus.application.version is the deployable's pom version, which the release stamps with the
# released calver.
qits.network-access.companion.image=registry.qits.${QITS_DOMAIN}/qits/qits-network-access-companion

# --- the API document ------------------------------------------------------------------------------
quarkus.smallrye-openapi.info-title=qits-network-access API
quarkus.swagger-ui.always-include=true

# --- the packaged artifact -------------------------------------------------------------------------
# The binary is `qits-network-access` (no -runner suffix); spelled again as failsafe's
# native.image.path in service/pom.xml and in docker/Dockerfile. The three move together.
quarkus.package.output-name=qits-network-access
quarkus.package.jar.add-runner-suffix=false

# --- the platform event bus ------------------------------------------------------------------------
# Nothing the bus needs is spelled here: it ships its own defaults. What belongs here is the
# darkness outside a deployment — a clone-alone `./mvnw verify` has no qits-events. Dark is not
# absent: the outbox datasource still opens and migrates, which is why the suite owes it a database.
%dev.qits.eventstream.enabled=false
%test.qits.eventstream.enabled=false

# --- telemetry -------------------------------------------------------------------------------------
# OTLP to qits-observability through the edge, by qits-telemetry-core's CDI exporters that attach
# the `qits` client's bearer. The three log keys are spelled out because Quarkus still labels its
# OpenTelemetry logging PREVIEW: a changed default must be a diff, not a silence.
quarkus.otel.traces.exporter=cdi
quarkus.otel.logs.enabled=true
quarkus.otel.logs.handler.enabled=true
quarkus.otel.logs.exporter=cdi
quarkus.otel.logs.level=INFO
quarkus.otel.metrics.enabled=true
quarkus.otel.metrics.exporter=cdi
%dev.quarkus.otel.sdk.disabled=true
%test.quarkus.otel.sdk.disabled=true
