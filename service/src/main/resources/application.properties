# The application config for qits-network-access as a standalone process (ordinal 250). The library
# jars ship their defaults at ordinal 100 in META-INF/microprofile-config.properties: `domain` its
# datasource, persistence unit, Flyway lineage and tunnel values; qits-eventstream its bus url,
# outbox datasource and retry budget. A deployment still overrides any of it by env.

quarkus.application.name=qits-network-access

# Every route lives under /network-access: the API at /network-access/api, and Quarkus' own
# non-application root (health, the API document) at /network-access/q, where the deploy gates on
# /network-access/q/health/ready (.config/qits/deployments.yml).
quarkus.rest.path=/network-access/api
quarkus.http.non-application-root-path=/network-access/q

# --- the management page ----------------------------------------------------------------------------
# Quinoa builds src/main/webui (the qits-network-access-frontend submodule, an Angular SPA) during
# augmentation and serves the output as static resources. It is the page a person registers a
# device on, downloads its config from and revokes it on; it lives on THIS public host because the
# page that grants the tunnel must not itself need the tunnel.
#
# THE PAGE IS SERVED AT THE ROOT of this service's own host, https://network-access.qits.<domain>/,
# as every microfrontend is. /network-access is the wire prefix (the API and the non-application
# root above), so the page cannot live under it without inverting the fallback rule below.
#
# ui-root-path `/` and the frontend's angular.json baseHref "/" must agree: Quinoa mounts the files,
# the baseHref is what makes index.html ask for them at the right url, and a mismatch serves a page
# whose every asset 404s with nothing on this side to notice. PackagedSurfaceIT asserts the base href
# for exactly that reason.
quarkus.quinoa.ui-root-path=/

# Deep links, and /auth/callback above all: the sign-in's PKCE redirect lands on a path no file sits
# behind, so without this the return from qits-idp is a 404.
quarkus.quinoa.enable-spa-routing=true

# Angular's output. Quinoa can derive this from the frontend's angular.json, but it derives it from a
# project NAME — pinning it means a rename over there fails this build ("Quinoa build directory not
# found") rather than resolving somewhere stale.
quarkus.quinoa.build-dir=dist/qits-network-access-frontend/browser

# WHAT THE SPA FALLBACK MUST NOT SWALLOW. The fallback is a late-order catch-all: a request matching
# no route is rerouted to index.html and answers 200 text/html. A mistyped or half-deployed machine
# path must answer 404, not hand a JSON parser (the page's own, the CLI's) an HTML document.
#
# ONE ENTRY IS THE WHOLE LIST, because matching is by path SEGMENT: /network-access covers
# /network-access/api (quarkus.rest.path) and /network-access/q (non-application-root-path) alike.
# Entries are matched after ui-root-path is stripped, and the ui root is `/`, so the value is the
# real path. The segment is spelled in three keys of this file plus `routes:` in
# .config/qits/deployments.yml; add a literal route outside it and its entry here IN THE SAME COMMIT.
quarkus.quinoa.ignored-path-prefixes=/network-access

# quarkus.quinoa.package-manager-install is deliberately NOT here. A local or CI mvnw build uses the
# node on PATH, so no build silently downloads a toolchain; the install flags appear only in
# docker/Dockerfile's builder stage, which ships no node at all.
#
# Quinoa is also disabled by default in TEST mode and is left that way: a @QuarkusTest asserting
# anything about / would pass against a process with no page in it, so what the page is actually
# served as is proved against the packaged artifact — PackagedSurfaceIT.

# --- machine identity -----------------------------------------------------------------------------
# EVERY DOOR TAKES A BEARER: there is no anonymous door here, reads included, because a peer list
# says who can reach the private edge. Each resource names its roles with @RolesAllowed (the design
# page's two sets; see api/Roles).
#
# THE PAGE'S STATIC FILES ARE NOT A DOOR. `/`, index.html, the bundles and the SPA fallback
# (/auth/callback) are served by Quinoa without a bearer, and that is deliberate: a browser carries
# no bearer on a navigation. The edge gates this host for browsers by session (a navigation without
# one is redirected to qits-idp's sign-in), and the page then obtains its bearer itself, by PKCE as
# the `qits-spa` client. No quarkus.http.auth.permission.* is set, so nothing demands a bearer
# outside the JAX-RS resources, and inside them @RolesAllowed still refuses an anonymous call 401.
#
# THE ROLLOUT GATE SHIPS ON (qits.auth.machine.required, defaulted false by qits-auth-core — this
# literal overrides that library default at ordinal 250). On, quarkus-oidc validates every bearer
# against qits-idp; off, there is no OIDC tenant at all. %dev./%test. put it off, which is what lets
# a clone-alone `./mvnw verify` need no issuer: the suites state their callers with @TestSecurity.
# There is no third state — either the gate and the validation are both on, or both off.
qits.auth.machine.required=true
quarkus.oidc.tenant-enabled=${qits.auth.machine.required:false}
%dev.qits.auth.machine.required=false
%test.qits.auth.machine.required=false

# Bearer-only: this service starts no login flow and holds no session.
#
# THE IDP IS DIALLED AT ITS EDGE HOST: https://idp.qits.<domain>/idp, never a wire alias.
# QITS_DOMAIN is injected into every container by qits-deployments and carries NO default here: a
# deployment without it refuses to start rather than validating against a half name.
quarkus.oidc.auth-server-url=https://idp.qits.${QITS_DOMAIN}/idp
quarkus.oidc.application-type=service

# Discovery ON (the default): the tenant reads /idp/.well-known/openid-configuration and takes the
# JWKS address from its jwks_uri. The pact pacts/qits-network-access-service_qits-idp-service.json
# binds both reads.

# ONE audience on this platform, carried by every token — a service's, a person's `qits` CLI token,
# a node's registration token alike — so it is a literal: what a caller may do is decided by its
# roles, never by which service it was addressed to.
quarkus.oidc.token.audience=qits-platform

# AN UNREACHABLE IDP DOES NOT STOP THIS SERVICE: the boot-time JWKS fetch fails to a WARN and is
# retried for connection-delay, and readiness stays independent of idp. This matters here more than
# most: the place that grants access must survive a fault of the things it grants access to.
quarkus.oidc.connection-delay=30S

# A ROTATED idp key reaches this service in seconds rather than the default ten minutes.
quarkus.oidc.token.forced-jwk-refresh-interval=PT5S

# --- the token this service PRESENTS ---------------------------------------------------------------
# ONE named client, `qits`: this process's own qits-idp service client by client credentials, the
# `idp:client` resource .config/qits/deployments.yml declares (id `<env>-qits-network-access`). The
# qits-eventstream library and qits-telemetry-core ask OidcClients for it by name, and so does the
# qits-system registration check of the node join (system/SystemBearer), the one caller in this
# source tree. Reference the raw env names inside `${…}`: QITS_RESOURCE_* has no dotted twin.
quarkus.oidc-client.qits.auth-server-url=${QITS_RESOURCE_IDP_URL:https://idp.qits.${QITS_DOMAIN}/idp}
quarkus.oidc-client.qits.discovery-enabled=false
quarkus.oidc-client.qits.token-path=token
quarkus.oidc-client.qits.client-id=${QITS_RESOURCE_IDP_CLIENT_ID:dev-qits-network-access}
quarkus.oidc-client.qits.credentials.secret=${QITS_RESOURCE_IDP_CLIENT_SECRET:}
quarkus.oidc-client.qits.grant.type=client
quarkus.oidc-client.qits.grant-options.client.audience=qits-platform
quarkus.oidc-client.qits.early-tokens-acquisition=false
quarkus.oidc-client.qits.client-enabled=true
%dev.quarkus.oidc-client.qits.client-enabled=false
%test.quarkus.oidc-client.qits.client-enabled=false

# --- the environment this service serves ------------------------------------------------------------
# The three consumers (bus/) select only frames of this environment: another environment's private
# edge, users and targets are not this tunnel's. qits-deployments injects QITS_ENVIRONMENT into every
# container.
qits.network-access.environment=${QITS_ENVIRONMENT:dev}

# --- qits-system, asked by the node join ------------------------------------------------------------
# POST /system/api/targets/{id}/registration-check (system/SystemTargets): whether a registration
# token is that target's. Scheme, host and port, no path: qits-system serves its own /system/api.
# THROUGH THE EDGE, as every platform host is reached (the owner's addressing rule; qits-workspaces'
# qits.system.url is the same address): the edge accepts this service's own `qits` bearer, and a
# private-edge fault does not reach it — this service is public on purpose. QITS_DOMAIN has no
# default, so a process without it refuses to start rather than asking a half name.
qits.network-access.system.url=https://system.qits.${QITS_DOMAIN}
quarkus.rest-client.qits-system.url=${qits.network-access.system.url}
quarkus.rest-client.qits-system.connect-timeout=2000
quarkus.rest-client.qits-system.read-timeout=10000

# --- the node helper GET /nodes/qits-node-tunnel serves ---------------------------------------------
# The static Go binary built from access-client/cmd/qits-node-tunnel by docker/Dockerfile's
# `access-client` stage and copied here by the runtime stage. The two move together.
qits.network-access.node-tunnel.path=/work/node-tunnel/qits-node-tunnel

# --- what GET /companion answers -------------------------------------------------------------------
# The companion rides inside this service's own image (docker/Dockerfile's runtime stage), so the
# CLI pulls exactly `<image>:<this service's version>` and runs it with this entrypoint and user —
# the uid that owns the image's empty /state. The entrypoint and the user move together with the
# Dockerfile. quarkus.application.version is the deployable's pom version, which the release
# stamps with the released calver.
qits.network-access.companion.image=registry.qits.${QITS_DOMAIN}/qits/qits-network-access
qits.network-access.companion.entrypoint=/work/companion/qits-access-companion
qits.network-access.companion.user=65532:65532

# --- the API document ------------------------------------------------------------------------------
quarkus.smallrye-openapi.info-title=qits-network-access API
quarkus.swagger-ui.always-include=true

# --- the packaged artifact -------------------------------------------------------------------------
# The binary is `qits-network-access` (no -runner suffix); spelled again as failsafe's
# native.image.path in service/pom.xml and in docker/Dockerfile. The three move together.
quarkus.package.output-name=qits-network-access
quarkus.package.jar.add-runner-suffix=false

# --- the platform event bus ------------------------------------------------------------------------
# Nothing the bus needs is spelled here: it ships its own defaults. What belongs here is the
# darkness outside a deployment — a clone-alone `./mvnw verify` has no qits-events. Dark is not
# absent: the outbox datasource still opens and migrates, which is why the suite owes it a database.
%dev.qits.eventstream.enabled=false
%test.qits.eventstream.enabled=false

# --- telemetry -------------------------------------------------------------------------------------
# OTLP to qits-observability through the edge, by qits-telemetry-core's CDI exporters that attach
# the `qits` client's bearer. The three log keys are spelled out because Quarkus still labels its
# OpenTelemetry logging PREVIEW: a changed default must be a diff, not a silence.
quarkus.otel.traces.exporter=cdi
quarkus.otel.logs.enabled=true
quarkus.otel.logs.handler.enabled=true
quarkus.otel.logs.exporter=cdi
quarkus.otel.logs.level=INFO
quarkus.otel.metrics.enabled=true
quarkus.otel.metrics.exporter=cdi
%dev.quarkus.otel.sdk.disabled=true
%test.quarkus.otel.sdk.disabled=true
