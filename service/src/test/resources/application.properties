# TEST-ONLY OVERRIDES. src/main/resources/application.properties is merged into the test config, so
# nothing it says is repeated here; a key appears only where the suite needs a different value.

# QITS_DOMAIN has no default in the shipped file; the companion image and the idp addresses expand it.
QITS_DOMAIN=wohlben.eu

# Both datasources run against an EMBEDDED POSTGRES (testdb/EmbeddedPgConfigSource supplies the urls).
# clean-at-start wipes each schema between Quarkus restarts.
quarkus.flyway.networkaccess.clean-at-start=true
quarkus.flyway.eventstream.clean-at-start=true

# No dev services: a clone tests green with no docker.
quarkus.devservices.enabled=false

# A free port, never 8081 (the platform's npm registry on the deployment host).
quarkus.http.test-port=0

# The environment the consumers select (bus/): the frames the suites build carry it.
qits.network-access.environment=dev

# The node helper: a small stand-in, so GET /nodes/qits-node-tunnel answers (and records) bytes.
# Relative to the module directory, where surefire and failsafe run.
qits.network-access.node-tunnel.path=src/test/resources/node-tunnel/qits-node-tunnel

# Nothing sweeps the outbox behind a test.
quarkus.scheduler.enabled=false
qits.eventstream.catchup-at-startup=false

# NO FORWARD-AUTH IN THE SUITE: no dev user, and header names no test sends, so a header-less request
# is anonymous and every caller is stated with @TestSecurity.
%test.qits.auth.forward.dev-user=
%test.qits.auth.forward.user-header=X-Qits-Disabled-User
%test.qits.auth.forward.roles-header=X-Qits-Disabled-Roles

# OpenApiSchemaExportTest writes docs/openapi.yml; info.version pinned so the file changes only with
# the API, and the application version pinned so GET /companion records the same answer every run.
quarkus.smallrye-openapi.info-version=0
quarkus.application.version=2026.1110.120000

# The userflows class orderer, installed the one way quarkus-junit permits (a secondary orderer): story
# classes sharing a profile run in @UserflowPrecondition order.
junit.quarkus.orderer.secondary-orderer=eu.wohlben.qits.userflows.UserflowClassOrderer
